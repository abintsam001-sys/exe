<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Download – EXE VAULT</title>
<style>
:root{color-scheme:dark;--bg:#050505;--card:#0b0b0c;--line:#252528;--ink:#f4f4f5;--mut:#8d8d96;--red:#d41c2e;--ember:#ff3347;--ok:#2fd27a;--slant:-14deg}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"Segoe UI",system-ui,sans-serif;
background-image:radial-gradient(55% 40% at 50% 0%,rgba(212,28,46,.2),transparent 70%),linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:100% 100%,44px 44px,44px 44px}
main{width:min(440px,100%)}
.logo{display:block;margin:0 auto 26px;width:min(210px,60%);height:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:in .5s cubic-bezier(.2,.7,.2,1) both}
.pad{padding:26px}
h1{margin:0;font-size:1.2rem;line-height:1.3;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--mut);font-size:.92rem}
/* loading: three slanted segments, same slant as the logo */
.seg{display:flex;gap:8px;margin:26px 0 14px}
.seg i{position:relative;flex:1;height:10px;background:#18181b;transform:skewX(var(--slant));overflow:hidden}
.seg b{position:absolute;inset:0;width:0;background:var(--red)}
.seg i.active b{animation:fill 1.3s cubic-bezier(.2,.8,.3,1) forwards}
.seg i.done b{width:100%;background:var(--ember);animation:none}
.now{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;min-height:22px}
.now strong{color:var(--ink);font-weight:600}
/* ready */
.file{display:flex;gap:14px;align-items:center}
.ico{flex:none;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:#121214;display:grid;place-items:center;color:var(--ember)}
.meta{display:flex;gap:8px;align-items:center;margin-top:4px;color:var(--mut);font-size:.88rem}
.badge{border:1px solid var(--line);background:#141416;color:var(--ink);border-radius:5px;padding:0 7px;font-size:.72rem;font-weight:700;letter-spacing:.04em}
.status{display:flex;align-items:center;gap:10px;margin:22px 0 14px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:#0f0f11;font-size:.9rem;color:#d8d8dd}
.status .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px rgba(255,51,71,.15)}
.status.ok .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(47,210,122,.15)}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:14px 20px;background:var(--red);color:#fff;font:inherit;font-weight:700;text-decoration:none;border-radius:9px 0 9px 0;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:background .15s,transform .15s}
.btn:hover{background:var(--ember)}
.btn:active{transform:translateY(1px)}
.btn.again{background:#1b1b1e;color:var(--ink)}
.btn.again:hover{background:#242428}
a:focus-visible,.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.foot{display:flex;justify-content:space-between;gap:16px;padding:12px 26px;border-top:1px solid var(--line);color:#6d6d76;font-size:.78rem}
.foot span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:inline-block;margin-top:18px;color:var(--mut);text-decoration:none;font-size:.9rem}
.back:hover{color:var(--ink)}
.center{text-align:center}
.err{color:var(--ember)}
@keyframes fill{to{width:88%}}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>

<noscript><p class="center">Turn on JavaScript to get your download link.</p></noscript>
<script>
const card = document.getElementById("card");
const label = document.getElementById("label");
const segs = [...document.querySelectorAll(".seg i")];
const id = new URLSearchParams(location.search).get("id");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const texts = ["Loading database…", "Finding your resource…", "Preparing your link…", "Link ready"];

function step(n) {
  segs.forEach((s, i) => { s.className = i < n ? "done" : i === n ? "active" : ""; });
  label.textContent = texts[n];
}

function showError(msg) {
  card.setAttribute("aria-busy", "false");
  card.innerHTML = '<div class="pad"><h1 class="err">Couldn’t prepare this download</h1>' +
    '<p class="sub">' + esc(msg) + "</p></div>";
}

function showReady(s, url) {
  const file = decodeURIComponent(url.pathname.split("/").pop() || "download");
  const ext = file.includes(".") ? file.split(".").pop().toUpperCase() : "FILE";
  document.title = s.name + " – EXE VAULT";
  card.setAttribute("aria-busy", "false");
  card.innerHTML =
    '<div class="pad">' +
      '<div class="file"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></div>' +
      "<div><h1>" + esc(s.name) + '</h1><div class="meta"><span class="badge">' + esc(ext) + "</span>" +
      (s.size ? "<span>" + esc(s.size) + "</span>" : "") + "</div></div></div>" +
      '<div class="status" id="status"><span class="dot"></span><span id="stext">Your link is ready</span></div>' +
      '<a class="btn" id="dl" href="' + esc(url.href) + '" download><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span id="btxt">Download file</span></a>' +
    "</div>" +
    '<div class="foot"><span>Hosted on ' + esc(url.hostname) + "</span><span>" + esc(file) + "</span></div>";
  document.getElementById("dl").addEventListener("click", () => {
    document.getElementById("status").classList.add("ok");
    document.getElementById("stext").textContent = "Download started. Check your downloads folder.";
    const b = document.getElementById("dl"); b.classList.add("again");
    document.getElementById("btxt").textContent = "Download again";
  });
}

(async () => {
  step(0);
  const [list] = await Promise.all([
    fetch("scripts.json", { cache: "no-store" }).then((r) => {
      if (!r.ok) throw new Error("The resource database could not be loaded. Try again in a minute.");
      return r.json();
    }),
    wait(900),
  ]);
  step(1); await wait(800);
  const s = Array.isArray(list) && list.find((x) => x.id === id);
  if (!s) throw new Error("This link doesn’t match any resource. Go back to the vault and pick one from the list.");
  let url; try { url = new URL(s.downloadUrl, location.href); } catch (e) {}
  if (!url || !/^https?:$/.test(url.protocol)) throw new Error("This resource has no valid download link yet. Please report it on Discord.");
  step(2); await wait(900);
  step(3); await wait(450);
  showReady(s, url);
})().catch((e) => showError(e.message));
</script>
