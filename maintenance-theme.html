<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0d;
    --panel: #131317;
    --line: #24242b;
    --ink: #f5f5f7;
    --muted: #9a9aa5;
    --violet: #7c5cff;
    --pink: #ff3d8a;
    --ok: #2ecc71;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    padding:24px;
  }

  .card{
    width:100%;
    max-width:560px;
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:28px;
  }

  .badge .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--pink);
    animation:pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(1.4); }
  }

  h1{
    font-size:clamp(28px, 6vw, 40px);
    font-weight:800;
    margin:0 0 14px;
    line-height:1.15;
  }

  h1 span{
    background:linear-gradient(90deg, var(--violet), var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  p{
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    margin:0 0 32px;
  }

  .bar-track{
    height:8px;
    border-radius:999px;
    background:var(--panel);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:12px;
  }

  .bar-fill{
    height:100%;
    width:68%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--violet), var(--pink));
  }

  .bar-label{
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="card">
  <div class="badge"><span class="dot"></span> Maintenance in progress</div>

  <h1>We'll be back <span>shortly</span></h1>
  <p>We're making some improvements behind the scenes. Thanks for your patience — check back in a little while.</p>

  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
  <div class="bar-label">Almost done</div>
</div>

</body>
</html>
